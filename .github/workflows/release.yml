name: Release

# Two ways to produce a release:
#
#   1. Push a tag        -> builds a signed APK and publishes it directly.
#                           git tag v1.0.0 && git push origin v1.0.0
#
#   2. Run this workflow manually (Actions -> Release -> Run workflow) and give it a tag.
#      Tick "draft" to publish a DRAFT release instead: the APK is built, signed and
#      uploaded, but the release stays invisible to everyone else until you press
#      "Publish release" on the GitHub release page. That is the way to review an
#      artifact before making it public.
#
# Signing needs two repository secrets:
#
#   KEYSTORE_BASE64    base64 of your .jks file
#                      ([Convert]::ToBase64String([IO.File]::ReadAllBytes("your.jks")))
#   KEYSTORE_PASSWORD  the keystore password
#
# Without them this workflow fails on purpose: publishing an unsigned or debug-signed
# release would be worse than not publishing at all. The regular Build workflow still
# verifies compilation on every push without needing any secret.
#
# The APK's versionName/versionCode are derived from git at build time (see
# app/build.gradle.kts), so tagging v1.1.0 is enough -- there is no version to bump by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true
      draft:
        description: 'Create as a draft release (review before publishing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -l "$GITHUB_WORKSPACE/release.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -Phideaccessibility.storeFile="$GITHUB_WORKSPACE/release.keystore" \
            -Phideaccessibility.storePassword="$KEYSTORE_PASSWORD" \
            -Phideaccessibility.keyAlias=hideaccessibility

      - name: Show the version that went into the APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" | grep '^package:'

      - name: Verify the APK is signed with the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" \
            verify --print-certs "$APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
