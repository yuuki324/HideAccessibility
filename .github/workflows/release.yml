name: Release

# Publishing a tag like v1.0.0 builds a signed APK and attaches it to a GitHub Release.
# Signing needs two repository secrets:
#
#   KEYSTORE_BASE64    base64 of your .jks file
#                      ([Convert]::ToBase64String([IO.File]::ReadAllBytes("your.jks")))
#   KEYSTORE_PASSWORD  the keystore password
#
# Without them this workflow fails on purpose: publishing an unsigned or debug-signed
# release would be worse than not publishing at all. The regular Build workflow still
# verifies compilation on every push without needing any secret.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -l "$GITHUB_WORKSPACE/release.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -Phideaccessibility.storeFile="$GITHUB_WORKSPACE/release.keystore" \
            -Phideaccessibility.storePassword="$KEYSTORE_PASSWORD" \
            -Phideaccessibility.keyAlias=hideaccessibility

      - name: Verify the APK is signed with the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" \
            verify --print-certs "$APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
